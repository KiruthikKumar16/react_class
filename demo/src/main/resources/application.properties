spring.application.name=demo
server.port=8080

# For local dev: set these as environment variables in your terminal/IDE run
# config, or temporarily replace with real values (never commit real
# credentials to a public repo).
# For Render deployment: set DB_URL, DB_USERNAME, DB_PASSWORD as Environment
# Variables in the Render dashboard.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
